<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fratoo — Fermentation Dashboard</title>
    <meta name="description" content="Live fermentation monitoring: bubble rate, temperature and estimated ABV." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Installable app (PWA): see public/manifest.webmanifest and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F2250" />
    <!-- iPhone / iPad "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fratoo" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      try {
        var t = localStorage.getItem('fratoo_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
