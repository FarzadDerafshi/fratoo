# Serves the built React SPA and proxies /api to the fratoo-bridge backend
# container (same Docker network, service name "api" — see
# ../docker-compose.yml). Client-side routing (react-router) needs the
# try_files fallback to index.html for any path nginx doesn't recognize as
# a real file.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A bare `proxy_pass http://api:3000/...` resolves "api" ONCE, when
    # nginx itself starts — if the api container wasn't fully attached to
    # the Docker network in that exact instant (a real race with
    # depends_on, which only waits for "started", not "network-ready"),
    # nginx fails with "host not found in upstream" and refuses to start
    # at all, repeating on every restart attempt until it happens to win
    # the race. Caught during the production deploy.
    #
    # Fix: put the hostname in a variable and point `resolver` at Docker's
    # embedded DNS (always 127.0.0.11). That forces nginx to resolve "api"
    # per-request instead of once at startup, so it comes up cleanly
    # regardless of container start order, and keeps working even if the
    # api container restarts later and gets a new internal IP.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No trailing path on the variable target: when proxy_pass's value
        # contains a variable, nginx does NOT do location-prefix
        # replacement the way it does for a static proxy_pass URI — it
        # appends the full original request URI (already "/api/...")
        # after this base as-is. Adding "/api/" here too doubled it into
        # "/api/api/..." and 404'd every request. Caught immediately by
        # testing the proxy after the resolver fix, not assumed to work.
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caching (the dashboard is also served through a Cloudflare Tunnel, which
    # caches .js/.css/.png by file extension unless told otherwise):
    # - /assets/ is Vite's content-hashed output: safe to cache forever.
    # - index.html, the service worker and the manifest must always be
    #   revalidated, or a deploy wouldn't reach browsers / installed apps
    #   (a stale sw.js could pin an old app shell indefinitely).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
