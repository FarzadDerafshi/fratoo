<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed icon for Android "maskable" and the iOS home screen: the OS
       crops it to its own shape, so the background fills the square and the
       mark stays inside the central safe zone (radius 40%). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4F91"/>
      <stop offset="1" stop-color="#0F2250"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#C98A0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(125 140) scale(2.4)">
    <path d="M22 51 C28 46 34 47 40 49 C46 51 52 50 58 47 C62 45 66 46 68 50 C72 58 72 70 66 80 C62 87 56 91 50 91 H24 C15 91 10 83 14 75 Z" fill="url(#beer)"/>
    <circle cx="34" cy="63.5" r="5" fill="#FFFFFF"/>
    <circle cx="47" cy="76.5" r="4.3" fill="#FFFFFF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 5 H61"/>
      <path d="M36 9 V25 L8 70 C3 79 9 92 22 92 H58"/>
      <path d="M53 9 V25 L66 43"/>
      <path d="M76 75 L100 42" stroke-width="5.5"/>
    </g>
    <circle cx="79" cy="48" r="5.5" fill="#FFFFFF"/>
    <circle cx="97" cy="69.5" r="6" fill="#FFFFFF"/>
  </g>
</svg>
